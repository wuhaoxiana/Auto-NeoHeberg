name: NeoHeberg Renew

on:
  schedule:
    # 每周一 UTC 02:00（北京时间周一 10:00）
    # 为什么不是每天：续期只在「剩余 <= RENEW_DAYS(14) 天」时触发，
    # 周频的最坏检测窗口是 7 天，仍有 7 天余量；且每天登录会反复暴露
    # 同一账号（风控），也白白消耗 Actions 时长。
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: renew
        type: choice
        options:
          - renew
          - selftest
      only:
        description: '仅处理某个账号（填 NEO_ACCOUNTS 里的 name，留空=全部）'
        required: false
        default: ''
        type: string

concurrency:
  group: neoheberg-renew
  cancel-in-progress: false

# 末尾两步需要：contents:write 提交 time.txt（保活，避免 60 天无提交被暂停），
# actions:write 删除旧的运行记录。默认 GITHUB_TOKEN 权限是只读，必须显式声明。
permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-24.04
    # 多账号是串行处理的（每账号约 1~2 分钟：登录+解验证码+续期/开机复验，
    # 账号间还有 NEO_ACCOUNT_DELAY 间隔）。账号多时相应调大这个上限，
    # 例如 20 个账号留 60 分钟。
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright pysocks
          playwright install --with-deps chromium

      - name: Setup proxy (sing-box)
        # setup_proxy.sh 在未配置 NODE_LINK 时自行退出并写入 IS_PROXY=false，
        # 属正常情况；故此处 continue-on-error —— 代理失败不应中断续期任务。
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: Check proxy status
        # 仓库是 public，Actions 日志对外可见。节点出口 IP 属凭证级信息
        # （暴露后可被针对性封禁），因此只打印结论 + 脱敏后的 IP 前缀。
        run: |
          if [ "${IS_PROXY:-false}" = "true" ]; then
            RAW_IP=$(curl -x "$PROXY_SERVER" -s --max-time 15 https://api.ipify.org || echo "")
            if [ -n "$RAW_IP" ]; then
              # 注册为掩码，防止后续步骤意外回显完整 IP
              echo "::add-mask::$RAW_IP"
              MASKED=$(printf '%s' "$RAW_IP" | awk -F. 'NF==4{print $1".x.x.x"}' )
              [ -z "$MASKED" ] && MASKED="x.x.x.x"
              echo "✅ 代理已启用，出口 IP：$MASKED（已脱敏）"
            else
              echo "⚠️ 代理已启用但出口 IP 查询失败"
            fi
          else
            echo "ℹ️ 未配置代理，直连模式"
          fi

      - name: Run renew + watchdog
        # 不要在此重新声明 PROXY_SERVER / IS_PROXY：
        # setup_proxy.sh 通过 $GITHUB_ENV 写出的变量会自动进入后续步骤的
        # shell 环境，脚本用 os.getenv 读取即可；若用 ${{ env.X }} 声明，
        # 该表达式取不到 GITHUB_ENV 的值，会写入空串覆盖继承来的值。
        env:
          # 多账号：NEO_ACCOUNTS 为账号数组的 JSON（见 README）。
          # 旧的单账号 secret 仍可用 —— 两者都配时以 NEO_ACCOUNTS 为准。
          NEO_ACCOUNTS: ${{ secrets.NEO_ACCOUNTS }}
          NEO_USER: ${{ secrets.NEO_USER }}
          NEO_PASSWORD: ${{ secrets.NEO_PASSWORD }}
          NEO_VMID: ${{ secrets.NEO_VMID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RENEW_DAYS: '14'
          NEO_ACCOUNT_DELAY: '20'
          ONLY_ACCOUNT: ${{ github.event.inputs.only }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "selftest" ]; then
            python renew.py --selftest
          elif [ -n "$ONLY_ACCOUNT" ]; then
            python renew.py --only "$ONLY_ACCOUNT"
          else
            python renew.py
          fi

      # 下面两步 if: always() —— 前面的续期步骤失败（例如登录失败）时也要执行，
      # 否则一次失败会让保活中断。

      - name: 🕒 更新时间（避免 60 天无提交导致定时工作流被暂停）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done

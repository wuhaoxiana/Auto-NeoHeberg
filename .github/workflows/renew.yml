name: NeoHeberg Renew

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: renew
        type: choice
        options:
          - renew
          - selftest

concurrency:
  group: neoheberg-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright pynacl
          playwright install --with-deps chromium

      - name: Run renew + watchdog
        env:
          NEO_USER: ${{ secrets.NEO_USER }}
          NEO_VMID: ${{ secrets.NEO_VMID }}
          NEO_COOKIE: ${{ secrets.NEO_COOKIE }}
          NEO_PASSWORD: ${{ secrets.NEO_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RENEW_DAYS: '14'
        run: |
          if [ "${{ github.event.inputs.mode }}" = "selftest" ]; then
            python renew.py --selftest
          else
            python renew.py
          fi
